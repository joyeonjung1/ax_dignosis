<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>제주 소상공인 AX 진단</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap">
<style>
/* Layout: 한 줄 채팅 + 상단 돌담 진행 바. 진단이 끝나면 채팅 아래로 처방전이 펼쳐지고 입력창은 사라진다. */
:root {
  --bg: #EDF2F1;
  --surface: #FFFFFF;
  --surface-2: #E3ECEA;
  --ink: #12262A;
  --ink-2: #4A6166;
  --line: #C8D6D3;
  --sea: #0E6B72;
  --on-sea: #FFFFFF;
  --sea-text: #0A5A60;
  --sea-soft: #DDEEEE;
  --tang: #E4761B;
  --tang-text: #A34E09;
  --tang-bg: #FFF0E0;
  --err: #A12D2D;
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", "Noto Sans KR", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0D1A1D;
    --surface: #142428;
    --surface-2: #1C3236;
    --ink: #E6F0EE;
    --ink-2: #9DB5B2;
    --line: #2A4549;
    --sea: #3FB6BC;
    --on-sea: #04282B;
    --sea-text: #7FD3D8;
    --sea-soft: #173A3E;
    --tang: #FF9440;
    --tang-text: #FFA45C;
    --tang-bg: #2E1E10;
    --err: #FF8A8A;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0D1A1D;
  --surface: #142428;
  --surface-2: #1C3236;
  --ink: #E6F0EE;
  --ink-2: #9DB5B2;
  --line: #2A4549;
  --sea: #3FB6BC;
  --on-sea: #04282B;
  --sea-text: #7FD3D8;
  --sea-soft: #173A3E;
  --tang: #FF9440;
  --tang-text: #FFA45C;
  --tang-bg: #2E1E10;
  --err: #FF8A8A;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 15px/1.6 var(--body);
  word-break: keep-all;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
button, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--tang); outline-offset: 2px; }

.app {
  max-width: 44rem;
  margin-inline: auto;
  min-height: 100%;
  display: flex;
  flex-direction: column;
  gap: 16px;
}

/* 머리글 */
.top { padding-top: 18px; }
.top-row { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
.kicker { margin: 0; font-size: 12.5px; letter-spacing: .02em; color: var(--ink-2); }
h1 {
  margin: 2px 0 0;
  font: 400 clamp(21px, 5.6vw, 27px)/1.3 var(--display);
  text-wrap: balance;
}
.ghost {
  flex: none;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 999px;
  padding: 4px 12px;
  font-size: 12.5px;
  color: var(--ink-2);
  cursor: pointer;
}
.ghost:hover { border-color: var(--sea); color: var(--sea-text); }

/* 돌담 진행 바: 돌마다 크기가 다르다 */
.wall { list-style: none; display: flex; gap: 4px; margin: 14px 0 0; padding: 0; }
.wall li {
  flex: var(--g, 1) 1 0;
  min-width: 0;
  display: flex;
  flex-direction: column;
  gap: 5px;
  font-size: 11px;
  line-height: 1.3;
  color: var(--ink-2);
  text-align: center;
}
.wall li::before {
  content: "";
  height: 10px;
  border-radius: var(--r, 6px);
  background: var(--line);
}
.wall li:nth-child(1) { --g: 1.15; --r: 8px 5px 7px 4px; }
.wall li:nth-child(2) { --g: .9;   --r: 5px 8px 4px 7px; }
.wall li:nth-child(3) { --g: 1.2;  --r: 7px 4px 8px 5px; }
.wall li:nth-child(4) { --g: .95;  --r: 4px 7px 5px 8px; }
.wall li:nth-child(5) { --g: 1.05; --r: 8px 6px 4px 7px; }
.wall li:nth-child(6) { --g: 1.2;  --r: 6px 8px 7px 4px; }
.wall li[data-state="done"]::before { background: var(--sea); }
.wall li[data-state="now"]::before { background: var(--tang); }
.wall li[data-state="now"] { color: var(--ink); font-weight: 600; }

/* 대화 */
main { flex: 1; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.log { display: flex; flex-direction: column; gap: 10px; }
.msg { display: flex; max-width: 100%; scroll-margin-bottom: 150px; }
.msg.user { justify-content: flex-end; }
.bubble {
  max-width: 88%;
  padding: 10px 14px;
  border-radius: 16px;
  white-space: pre-wrap;
  overflow-wrap: anywhere;
}
.assistant .bubble { background: var(--surface); border: 1px solid var(--line); border-top-left-radius: 6px; }
.user .bubble { background: var(--sea); color: var(--on-sea); border-top-right-radius: 6px; }
.bubble.typing { display: inline-flex; gap: 5px; align-items: center; padding: 15px 16px; }
.bubble.typing i { width: 6px; height: 6px; border-radius: 50%; background: var(--ink-2); animation: hop 1s infinite ease-in-out; }
.bubble.typing i:nth-child(2) { animation-delay: .15s; }
.bubble.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes hop { 0%, 80%, 100% { transform: translateY(0); opacity: .5; } 40% { transform: translateY(-4px); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .bubble.typing i { animation: none; opacity: .7; } }

.chips { display: flex; flex-wrap: wrap; gap: 8px; scroll-margin-bottom: 150px; }
.chips:empty { display: none; }
.chip {
  background: var(--surface);
  border: 1px solid var(--sea);
  color: var(--sea-text);
  border-radius: 999px;
  padding: 7px 14px;
  cursor: pointer;
}
.chip:hover { background: var(--sea-soft); }
.chip.on { background: var(--sea); color: var(--on-sea); }
.chip.retry { border-color: var(--tang); color: var(--tang-text); background: var(--tang-bg); }

/* 입력창 */
.composer {
  position: sticky;
  bottom: 0;
  background: var(--bg);
  border-top: 1px solid var(--line);
  padding: 10px 0 12px;
}
.actions { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 8px; }
.actions .ghost { font-size: 12.5px; }
.form { display: flex; gap: 8px; align-items: flex-end; }
textarea {
  flex: 1;
  min-width: 0;
  resize: none;
  max-height: 120px;
  padding: 10px 12px;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  line-height: 1.5;
}
textarea:disabled { opacity: .6; }
.btn {
  flex: none;
  min-height: 44px;
  padding: 0 18px;
  border: 0;
  border-radius: 12px;
  background: var(--sea);
  color: var(--on-sea);
  font-weight: 600;
  cursor: pointer;
}
.btn.alt { background: var(--surface); color: var(--sea-text); border: 1px solid var(--sea); }
.mic {
  flex: none;
  width: 44px;
  height: 44px;
  display: grid;
  place-items: center;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--surface);
  cursor: pointer;
}
.mic.on { background: var(--tang-bg); border-color: var(--tang); color: var(--tang-text); }
.status { min-height: 1.5em; margin: 6px 0 0; font-size: 12.5px; color: var(--ink-2); }
.status.err { color: var(--err); }

/* 진단서 */
.diag { display: flex; flex-direction: column; gap: 16px; padding-bottom: 28px; scroll-margin-top: 12px; }
.diag-head { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; }
.diag h2 { margin: 0; font: 400 24px/1.3 var(--display); }
.badge {
  font-size: 11.5px;
  padding: 1px 9px;
  border-radius: 999px;
  border: 1px solid var(--tang);
  color: var(--tang-text);
  background: var(--tang-bg);
}
.tabs { display: flex; flex-wrap: wrap; gap: 8px; }
.store { margin: 0; color: var(--ink-2); font-size: 13.5px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 16px; min-width: 0; }
.panel h3 { margin: 0 0 12px; font-size: 13px; letter-spacing: .04em; color: var(--ink-2); font-weight: 600; }
.row { display: grid; gap: 5px; margin-bottom: 14px; }
.row:last-of-type { margin-bottom: 0; }
.row-top { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 2px 12px; }
.task { font-weight: 600; min-width: 0; overflow-wrap: anywhere; }
.hrs { font-size: 13px; color: var(--ink-2); font-variant-numeric: tabular-nums; }
.track { height: 10px; border-radius: 6px; background: var(--surface-2); overflow: hidden; }
.track.unknown { background: transparent; border: 1px dashed var(--line); }
.fill { height: 100%; border-radius: 6px; background: var(--sea); }
.row:first-child .fill { background: var(--tang); }
.why { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.save { display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; margin-top: 16px; padding-top: 14px; border-top: 1px dashed var(--line); }
.save .num { font: 400 34px/1.1 var(--display); color: var(--tang-text); font-variant-numeric: tabular-nums; }
.save .cap { font-size: 13.5px; color: var(--ink-2); }
.opp { margin: 0 0 12px; }
.opp:last-child { margin-bottom: 0; }
.opp b { display: block; }
.opp span { font-size: 13.5px; color: var(--ink-2); }

.rx { background: var(--surface); border: 1.5px solid var(--sea); border-radius: 16px; overflow: hidden; }
.rx-head {
  display: flex; flex-wrap: wrap; align-items: center; gap: 10px 14px;
  padding: 14px 16px;
  background: var(--sea-soft);
  border-bottom: 2px dashed var(--sea);
}
.stamp {
  font: 400 18px/1.2 var(--display);
  letter-spacing: .06em;
  color: var(--tang-text);
  background: var(--tang-bg);
  border: 2px solid var(--tang);
  border-radius: 6px;
  padding: 2px 10px;
  transform: rotate(-3deg);
}
.rx-meta { display: flex; flex-wrap: wrap; gap: 6px; }
.tag { font-size: 12.5px; padding: 2px 10px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line); color: var(--ink-2); }
.rx-body { padding: 16px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.rx-title { margin: 0; font-size: 17px; font-weight: 600; text-wrap: balance; }
.steps { margin: 0; padding-left: 1.3em; display: grid; gap: 6px; }
.steps li::marker { color: var(--sea-text); font-weight: 600; }
.pbox { border-radius: 10px; background: var(--surface-2); padding: 12px; min-width: 0; }
.pbox-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; font-size: 12.5px; color: var(--ink-2); }
.pbox pre { margin: 0; white-space: pre-wrap; overflow-wrap: anywhere; font: 13.5px/1.65 var(--body); }
.mini { background: var(--surface); border: 1px solid var(--sea); color: var(--sea-text); border-radius: 8px; padding: 3px 12px; cursor: pointer; font-size: 12.5px; }
.effect { margin: 0; font-size: 13.5px; color: var(--ink-2); }
.later { margin: 0 0 10px; }
.later:last-child { margin-bottom: 0; }
.later b { display: block; }
.later span { font-size: 13.5px; color: var(--ink-2); }
.support { margin: 0; font-size: 13.5px; }
.note { margin: 0; font-size: 12.5px; color: var(--ink-2); }
.diag-actions { display: flex; flex-wrap: wrap; gap: 8px; }
.fallback { margin: 0; padding: 12px; border-radius: 10px; background: var(--surface-2); white-space: pre-wrap; overflow-wrap: anywhere; font-size: 13px; }

.loading { display: grid; gap: 8px; }
.loading p { margin: 0; }
.loading .line { font-weight: 600; }
.loading .sub { font-size: 13px; color: var(--ink-2); }
.errbox { color: var(--err); }

/* PDF용 종이 화면: 화면 밖에서 항상 흰 바탕으로 그려서 이미지로 찍는다 */
.pdfsheet { position: fixed; left: -10000px; top: 0; width: 760px; background: #FFFFFF; color: #12262A; font: 15px/1.6 "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; word-break: keep-all; }
.pdfsheet .ps { background: #FFFFFF; padding: 16px 20px; border: 1px solid #C8D6D3; border-radius: 10px; }
.pdfsheet .ps h2 { margin: 0 0 4px; font: 400 26px/1.3 "Do Hyeon", "Malgun Gothic", sans-serif; color: #0A5A60; }
.pdfsheet .ps h3 { margin: 0 0 10px; font-size: 13px; color: #4A6166; font-weight: 600; }
.pdfsheet .ps p { margin: 0 0 8px; }
.pdfsheet .ps .sub { font-size: 13px; color: #4A6166; }
.pdfsheet .ps .b { font-weight: 600; }
.pdfsheet .ps .bar { height: 9px; border-radius: 5px; background: #E3ECEA; margin: 4px 0; }
.pdfsheet .ps .bar i { display: block; height: 100%; border-radius: 5px; background: #0E6B72; }
.pdfsheet .ps .bar.top i { background: #E4761B; }
.pdfsheet .ps .big { font: 400 26px/1.2 "Do Hyeon", "Malgun Gothic", sans-serif; color: #A34E09; }
.pdfsheet .ps.rx { border: 2px solid #0E6B72; }
.pdfsheet .ps pre { margin: 6px 0 0; padding: 10px 12px; background: #E3ECEA; border-radius: 8px; white-space: pre-wrap; overflow-wrap: anywhere; font: 13px/1.6 "IBM Plex Sans KR", "Malgun Gothic", sans-serif; }
.pdfsheet .ps ol { margin: 6px 0; padding-left: 1.3em; }

[hidden] { display: none !important; }
.privacy { margin: 10px 0 0; font-size: 12px; color: var(--ink-2); }
.panel .form input { flex: 1; min-width: 0; min-height: 44px; padding: 8px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); }
</style>

</head>
<body>
<div class="app">
  <header class="top">
    <div class="top-row">
      <div>
        <p class="kicker">제주 소상공인 · AX 진단 도우미</p>
        <h1>사장님, 오늘 하루 어떻게 보내세요?</h1>
      </div>
      <button id="reset" class="ghost" type="button">새로 시작</button>
    </div>
    <ol id="wall" class="wall" aria-label="진단 진행 단계">
      <li>가게</li><li>하루</li><li>시간</li><li>매출</li><li>도구</li><li>진단서</li>
    </ol>
    <p class="privacy">입력하신 내용은 진단과 서비스 개선을 위해 저장됩니다. 손님 이름·연락처 같은 개인정보는 적지 마세요.</p>
  </header>

  <main>
    <div id="log" class="log" role="log" aria-live="polite"></div>
    <div id="chips" class="chips"></div>
    <section id="diag" class="diag" hidden aria-label="진단서"></section>
  </main>

  <footer id="composer" class="composer">
    <div class="actions">
      <button id="diagnoseNow" class="ghost" type="button" hidden>지금까지 말씀으로 진단받기</button>
      <button id="sampleBtn" class="ghost" type="button">업종별 예시 진단서 보기</button>
    </div>
    <form id="form" class="form">
      <textarea id="input" rows="1" placeholder="사장님 답을 적어 주세요" aria-label="사장님 답"></textarea>
      <button id="mic" class="mic" type="button" hidden aria-label="음성으로 말하기" aria-pressed="false">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V22h2v-3.08A7 7 0 0 0 19 12h-2Z"/></svg>
      </button>
      <button id="send" class="btn" type="submit">보내기</button>
    </form>
    <p id="status" class="status" role="status"></p>
  </footer>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
(function () {
  'use strict';

  var KEY = 'jeju-ax-diag-v2';
  var reduce = !!(window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches);



  var GREETING_RAW = '안녕하세요, 사장님! 저는 가게의 하루를 같이 살펴보고, AI로 줄일 수 있는 일을 찾아 드리는 도우미예요. 식당, 분식집, 베이커리, 미용실, 소품샵, 편의점, 건설업 어떤 일이든 괜찮아요. 질문은 열 개가 안 되고, 마지막에 내일 바로 따라 할 수 있는 방법 한 가지를 드릴게요.\n\n먼저 소개부터 부탁드려요. 어떤 일을 하고 계신가요? 아래에 없으면 직접 적어 주세요.\n[[선택:식당·카페|분식집|베이커리|미용실|피부관리샵|소품샵|편의점|건설업]]\n[[단계:1]]';

  var EXAMPLES = [
    {
      label: '식당',
      store: '서귀포 흑돼지 구이집 · 사장님 부부와 직원 2명 · 손님은 관광객 6, 도민 4',
      timeUse: [

        { task: '메뉴·원산지 설명(외국인 손님 포함)', hours: 6, basis: '추정', why: '성수기에는 테이블마다 같은 설명을 반복하고, 외국인 손님은 손짓으로 안내하고 계세요.' },
        { task: '리뷰 답글과 인스타 올리기', hours: 4, basis: '말씀하신 값', why: '마감 후 피곤한 시간에 몰아서 하다 보니 자주 밀린다고 하셨어요.' },

      ],
      savable: { min: 6, max: 10 },
      revenue: [
        { title: '비수기 평일 저녁 손님 늘리기', why: '비수기에는 도민 손님이 중심이라고 하셨는데, 단골에게 보낼 안내 문구가 따로 없어요.' },
        { title: '외국인 손님이 바로 읽는 메뉴 안내', why: '외국인 손님 응대에 시간이 많이 들고, 번역된 메뉴판이 없다고 하셨어요.' },
        { title: '리뷰 답글로 처음 오는 손님 마음 잡기', why: '답글이 밀리는 동안 새 리뷰에 아무 반응이 없는 상태예요.' }
      ],
      rx: {
        title: '자주 받는 질문 10개를 정리해서 카카오톡 채널 자동응답에 넣기',
        tool: '챗AI 앱 + 카카오톡 채널 자동응답',
        minutes: 25,

    setTimeout(function () { delete btn.dataset.flash; refreshPdfBtn(); }, 2600);
  }

  /* 진단서가 끝나면 PDF를 만들자마자 저장 확인창을 띄운다. 저장은 사장님이 확인창에서 허용해야 끝난다. */
  async function autoSavePdf(d) {
    var e = pdfEntry(d);
    try {
      var blob = await e.promise;
      if (!dl || shownDiag !== d) return;
      await dl.save({ filename: 'AX진단서_' + new Date().toISOString().slice(0, 10) + '.pdf', data: blob });
      flashPdf('저장했어요');
    } catch (err) {
      var c = err && err.code;
      if (c === 'declined') flashPdf('저장을 취소했어요');
      /* 그 밖의 경우에는 "PDF로 저장" 버튼을 눌러 다시 저장할 수 있다 */
    }
  }

  /* ---------- 구글 시트에 저장 ---------- */
  var savedToSheet = false;
  function saveToSheet(d) {
    if (savedToSheet) return;
    savedToSheet = true;
    try {
      fetch('/api/save', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, keepalive: true,
        body: JSON.stringify({ type: 'diagnosis', id: sessionId, diag: d, transcript: transcript() })
      }).catch(function () {});
    } catch (e) {}
  }

  function contactPanel() {
    var input = h('input', { id: 'contactInput', type: 'text', placeholder: '휴대폰 번호 또는 카카오톡 아이디', 'aria-label': '연락처', maxlength: '60', autocomplete: 'off' });
    var msg = h('p', { class: 'note', text: '' });
    var btn = h('button', { class: 'btn alt', type: 'button', text: '남기기' });
    btn.addEventListener('click', async function () {
      var v = input.value.trim();
      if (!v) { msg.textContent = '연락처를 적어 주세요.'; return; }
      btn.disabled = true;
      try {
        var r = await fetch('/api/save', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ type: 'contact', id: sessionId, contact: v }) });
        if (!r.ok) throw new Error('x');
        msg.textContent = '남겨 주셔서 감사합니다. 진단서를 보낸 뒤에는 삭제합니다.';
        input.disabled = true;
      } catch (e) { msg.textContent = '저장하지 못했어요. 잠시 뒤 다시 눌러 주세요.'; btn.disabled = false; }
    });
    return h('section', { class: 'panel' },
      h('h3', { text: '진단서를 받아보고 싶으세요? (선택)' }),
      h('p', { class: 'note', text: '연락처는 진단서를 보내 드리는 데만 쓰고, 보낸 뒤에는 삭제합니다.' }),
      h('div', { class: 'form' }, input, btn),
      msg);
  }

  async function onPdfClick() {
    var d = shownDiag;
    if (!d || !dl) return;
    var e = pdfCache.get(d);
    if (e && e.state === 'error') { pdfCache.delete(d); e = null; }
    e = e || pdfEntry(d);
    refreshPdfBtn();
    try {
      var blob = await e.promise;
      await dl.save({ filename: 'AX진단서_' + new Date().toISOString().slice(0, 10) + '.pdf', data: blob });
      flashPdf('저장했어요');
    } catch (err) {
      var c = err && err.code;
      flashPdf(c === 'declined' ? '저장을 취소했어요' : (c === 'rate_limited' ? '잠시 뒤 다시 눌러 주세요' : '저장하지 못했어요'));
    }
  }

  function showDiag(d, isExample) {
    shownDiag = d;
    var root = $('diag');
    root.replaceChildren();
    root.hidden = false;

    var max = Math.max.apply(null, [1].concat(d.timeUse.map(function (x) { return x.hours || 0; })));
    var rows = d.timeUse.map(function (x) {
      return h('div', { class: 'row' },
        h('div', { class: 'row-top' },
          h('span', { class: 'task', text: x.task }),
          h('span', { class: 'hrs', text: x.hours != null ? '주 ' + fmt(x.hours) + '시간' + (x.basis ? ' · ' + x.basis : '') : '시간 확인 필요' })),
        h('div', { class: 'track' + (x.hours == null ? ' unknown' : '') },
          x.hours != null ? h('div', { class: 'fill', style: { width: Math.max(4, Math.round(x.hours / max * 100)) + '%' } }) : null),
        x.why ? h('p', { class: 'why', text: x.why }) : null);
    });

    var timePanel = h('section', { class: 'panel' },
      h('h3', { text: '시간을 많이 쓰는 일' }),
      rows,
      d.savable ? h('div', { class: 'save' },
        h('span', { class: 'num', text: '주 ' + fmt(d.savable.min) + '~' + fmt(d.savable.max) + '시간' }),
        h('span', { class: 'cap', text: 'AI로 줄일 수 있는 시간(추정)' })) : null);

    var revPanel = d.revenue.length ? h('section', { class: 'panel' },
      h('h3', { text: '매출을 올릴 기회' }),
      d.revenue.map(function (x) {
        return h('p', { class: 'opp' }, h('b', { text: x.title }), x.why ? h('span', { text: x.why }) : null);
      })) : null;

    var fallbackPrompt = h('pre', { class: 'fallback', hidden: true, text: d.rx.prompt });
    var promptBox = d.rx.prompt ? h('div', { class: 'pbox' },
      h('div', { class: 'pbox-top' },
        h('span', { text: 'AI 앱에 붙여넣을 말' }),
        h('button', { class: 'mini', type: 'button', text: '복사', onclick: function (e) { copyText(d.rx.prompt, e.currentTarget, fallbackPrompt); } })),
      h('pre', { text: d.rx.prompt }),
      fallbackPrompt) : null;

    var rx = h('section', { class: 'rx' },
      h('div', { class: 'rx-head' },
        h('span', { class: 'stamp', text: '내일 할 일' }),
        h('div', { class: 'rx-meta' },
          d.rx.tool ? h('span', { class: 'tag', text: d.rx.tool }) : null,
          d.rx.minutes != null ? h('span', { class: 'tag', text: fmt(d.rx.minutes) + '분' }) : null)),
      h('div', { class: 'rx-body' },
        h('p', { class: 'rx-title', text: d.rx.title }),
        d.rx.steps.length ? h('ol', { class: 'steps' }, d.rx.steps.map(function (st) { return h('li', { text: st }); })) : null,
        promptBox,
        d.rx.effect ? h('p', { class: 'effect', text: d.rx.effect }) : null));

    var laterPanel = d.later.length ? h('section', { class: 'panel' },
      h('h3', { text: '그다음에 해 볼 일' }),
      d.later.map(function (x) {
        return h('p', { class: 'later' }, h('b', { text: x.title }), x.detail ? h('span', { text: x.detail }) : null);
      })) : null;

    var supportPanel = d.support ? h('section', { class: 'panel' },
      h('h3', { text: '받을 수 있는 지원' }),
      h('p', { class: 'support', text: d.support })) : null;

    var summary = summaryText(d);
    var fallbackSummary = h('pre', { class: 'fallback', hidden: true, text: summary });
    var actions = h('div', { class: 'diag-actions' },
      h('button', { class: 'btn', type: 'button', text: '요약 복사', onclick: function (e) { copyText(summary, e.currentTarget, fallbackSummary); } }),
      h('button', { id: 'pdfBtn', class: 'btn', type: 'button', text: 'PDF로 저장', hidden: !dl, onclick: onPdfClick }),
      isExample
        ? h('button', { class: 'btn alt', type: 'button', text: '예시 닫기', onclick: closeExample })
        : [
            h('button', { class: 'btn alt', type: 'button', text: '다시 진단', onclick: function () { if (!busy) runDiagnosis(true); } }),
            h('button', { class: 'btn alt', type: 'button', text: '다른 가게 진단하기', onclick: hardReset })
          ]);

    var tabs = isExample ? h('div', { class: 'tabs', role: 'group', 'aria-label': '업종 선택' },
      EXAMPLES.map(function (ex, i) {
        return h('button', {
          class: 'chip' + (i === exampleIdx ? ' on' : ''), type: 'button', text: ex.label,
          'aria-pressed': i === exampleIdx ? 'true' : 'false',
          onclick: function () { exampleIdx = i; showDiag(EXAMPLES[i], true); }
        });
      })) : null;

    add(root, [
      h('div', { class: 'diag-head' },
        h('h2', { text: '우리 가게 진단서' }),
        isExample ? h('span', { class: 'badge', text: '예시' }) : null),
      tabs,
      d.store ? h('p', { class: 'store', text: d.store }) : null,
      timePanel, revPanel, rx, laterPanel, supportPanel,
      d.note ? h('p', { class: 'note', text: d.note }) : null,
      isExample ? null : contactPanel(),
      actions, fallbackSummary]);
    root.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
    if (!isExample) pdfEntry(d);
    refreshPdfBtn();
  }

  function showLoading() {
    var root = $('diag');
    root.hidden = false;
    var lines = ['대화를 정리하고 있어요', '시간을 가장 많이 쓰는 일을 고르고 있어요', '내일 바로 할 일 한 가지를 정하고 있어요', '거의 다 됐어요'];
    var i = 0;
    var line = h('p', { class: 'line', text: lines[0] });
    root.replaceChildren(h('div', { class: 'panel loading', role: 'status' },
      line,
      h('p', { class: 'sub', text: '보통 30초에서 1분쯤 걸려요. 멈추려면 아래 멈추기를 누르세요.' })));
    var timer = setInterval(function () {
      i = Math.min(i + 1, lines.length - 1);
      line.textContent = lines[i];
    }, 7000);
    root.scrollIntoView({ block: 'start', behavior: reduce ? 'auto' : 'smooth' });
    return function stop() { clearInterval(timer); };
  }

  async function runDiagnosis(regen) {
    var id = ++run;
    var s = await sampleReady;
    if (id !== run) return;
    closeExample();
    setStatus('');
    clearChips();
    setBusy(true);
    $('composer').hidden = false;
    $('diagnoseNow').hidden = true;
    setStage(6);
    var stopLoading = showLoading();
    ctl = new AbortController();
    try {
      var data = await s.json(transcript(), { signal: ctl.signal });
      if (id !== run) { stopLoading(); return; }
      stopLoading();
      diag = normalize(data);
      stage = 6;
      setStage(7);
      save();
      setBusy(false);
      showDiag(diag, false);
      autoSavePdf(diag);
      saveToSheet(diag);
    } catch (e) {
      stopLoading();
      if (id !== run) return;
      setBusy(false);
      diag = null;
      setStage(5);
      var code = e && e.code;
      var root = $('diag');
      var c = code === 'cancelled' ? { msg: '멈췄어요.', retry: true } : errorCopy(code);
      root.replaceChildren(h('div', { class: 'panel' },
        h('p', { class: 'errbox', text: c.msg }),
        c.retry ? h('div', { class: 'diag-actions' },
          h('button', { class: 'btn', type: 'button', text: '진단서 다시 만들기', onclick: function () { if (!busy) runDiagnosis(true); } })) : null));
      if (c.lock) lockComposer();
    }
  }

  /* ---------- 예시, 초기화 ---------- */
  function closeExample() {
    if (!exampleOpen) return;
    exampleOpen = false;
    if (!diag) { $('diag').hidden = true; $('diag').replaceChildren(); }
    else showDiag(diag, false);
  }
  function openExample() {
    if (busy) return;
    exampleOpen = true;
    showDiag(EXAMPLES[exampleIdx], true);
  }

  function hardReset() {
    run++;
    if (ctl) { try { ctl.abort(); } catch (e) {} }
    turns = [{ role: 'assistant', content: GREETING_RAW }];
    stage = 1; diag = null; exampleOpen = false; busy = false;
    savedToSheet = false;
    sessionId = (window.crypto && crypto.randomUUID) ? crypto.randomUUID() : String(Date.now()) + Math.random().toString(16).slice(2);
    $('diag').hidden = true; $('diag').replaceChildren();
    try { localStorage.removeItem(KEY); } catch (e) {}
    renderAll();
    setStatus('');
    window.scrollTo(0, 0);
  }

  function renderAll() {
    $('log').replaceChildren();
    turns.forEach(function (t) {
      if (t.role === 'assistant') addMsg('assistant', parse(t.content).text);
      else addMsg('user', t.content);
    });
    var last = turns[turns.length - 1];
    clearChips();
    if (diag) showDiag(diag, false);
    else if (last.role === 'assistant') renderChips(parse(last.content).choices);
    else renderRetry('이어서 답 받기', ask);
    setStage(diag ? 7 : stage);
    updateControls();
  }

  /* ---------- 연결 ---------- */
  $('form').addEventListener('submit', function (e) {
    e.preventDefault();
    if (busy) { if (ctl) ctl.abort(); return; }
    var v = $('input').value.trim();
    if (!v) return;
    $('input').value = '';
    autosize();
    sendUser(v);
  });
  $('input').addEventListener('input', autosize);
  $('input').addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey && !e.isComposing && e.keyCode !== 229) {
      e.preventDefault();
      $('form').requestSubmit();
    }
  });
  $('diagnoseNow').addEventListener('click', function () { if (!busy) runDiagnosis(false); });
  $('sampleBtn').addEventListener('click', openExample);

  var armed = 0;
  $('reset').addEventListener('click', function () {
    var b = $('reset');
    if (!armed) {
      b.textContent = '정말 지울까요?';
      armed = setTimeout(function () { armed = 0; b.textContent = '새로 시작'; }, 3000);
      return;
    }
    clearTimeout(armed); armed = 0;
    b.textContent = '새로 시작';
    hardReset();
  });

  /* 음성 입력: 브라우저의 음성 인식을 지원하는 화면에서만 마이크 버튼이 보인다 */
  (function () {
    var SR = window.SpeechRecognition || window.webkitSpeechRecognition;
    if (!SR) return;
    var mic = $('mic'), rec = null, listening = false;
    mic.hidden = false;
    function setListening(on) {
      listening = on;
      mic.classList.toggle('on', on);
      mic.setAttribute('aria-pressed', on ? 'true' : 'false');
      if (!on) setStatus('');
    }
    mic.addEventListener('click', function () {
      if (listening && rec) { try { rec.stop(); } catch (e) {} return; }
      try {
        rec = new SR();
        rec.lang = 'ko-KR';
        rec.interimResults = true;
        rec.continuous = false;
        var finalText = '';
        rec.onresult = function (ev) {
          var interim = '';
          for (var i = ev.resultIndex; i < ev.results.length; i++) {
            var t = ev.results[i][0].transcript;
            if (ev.results[i].isFinal) finalText += t; else interim += t;
          }
          if (interim) setStatus('듣는 중: ' + interim);
        };
        rec.onerror = function () { setStatus('음성 입력을 켜지 못했어요. 글로 적어 주세요.', true); };
        rec.onend = function () {
          setListening(false);
          if (finalText) {
            var t = $('input');
            t.value = (t.value ? t.value + ' ' : '') + finalText.trim();
            autosize();
          }
        };
        rec.start();
        setListening(true);
      } catch (e) { setStatus('음성 입력을 켜지 못했어요. 글로 적어 주세요.', true); }
    });
  })();

  /* ---------- 시작 ---------- */
  var saved = load();
  if (saved) {
    turns = saved.turns;
    stage = (saved.stage >= 1 && saved.stage <= 6) ? saved.stage : 1;
    try { diag = saved.diag ? normalize({
      store: saved.diag.store,
      timeUse: (saved.diag.timeUse || []).map(function (x) { return { task: x.task, hoursPerWeek: x.hours, basis: x.basis, why: x.why }; }),
      savableHours: saved.diag.savable,
      revenue: saved.diag.revenue,
      prescription: saved.diag.rx ? { title: saved.diag.rx.title, tool: saved.diag.rx.tool, minutes: saved.diag.rx.minutes, steps: saved.diag.rx.steps, copyPrompt: saved.diag.rx.prompt, effect: saved.diag.rx.effect } : null,
      later: saved.diag.later,
      support: saved.diag.support,
      note: saved.diag.note
    }) : null; } catch (e) { diag = null; }
  }
  renderAll();
  autosize();
  focusInput();
})();
</script>
</body>
</html>
